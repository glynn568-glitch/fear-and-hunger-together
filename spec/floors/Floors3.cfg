\* Safety with three games (two on her floor, one elsewhere; a game hearing two partners' writes
\* while its own is on the way), one write each, two map changes, one broken line. Check only:
\* fcheck --cfg Floors3.cfg --only check. The games are alike, so symmetry.
CONSTANTS
    Clients = {A, B, C}
    Maps = {M1, M2}
    Nil = Nil
    MaxWrites = 1
    MaxMoves = 2
    MaxDrops = 1
SYMMETRY Perms
SPECIFICATION Spec
INVARIANTS TypeOK NoForeignWake ShowsItsFloor Agree FlightIsTrue NothingOnTheWayAtTable WriteFindsLive TableFindsOut
PROPERTIES NoEcho KeptWhileDown ArrivalSendsNothing WriteStaysOnItsMap
