\* The gate config (mutants, bug replays): two games, two floors, two writes each (two games writing
\* one floor's key with different values at once needs two: a first wake, then the door), one map
\* change, one broken line. Safety and liveness. FloorsBig.cfg and Floors3.cfg are check-only runs.
CONSTANTS
    Clients = {A, B}
    Maps = {M1, M2}
    Nil = Nil
    MaxWrites = 2
    MaxMoves = 1
    MaxDrops = 1
SPECIFICATION Spec
INVARIANTS TypeOK NoForeignWake ShowsItsFloor Agree FlightIsTrue NothingOnTheWayAtTable WriteFindsLive TableFindsOut
PROPERTIES NoEcho KeptWhileDown ArrivalSendsNothing WriteStaysOnItsMap SettlesInAgreement
