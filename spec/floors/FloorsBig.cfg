\* The bigger run, check only (fcheck --cfg FloorsBig.cfg --only check): two games, two floors, two
\* writes each, two map changes, one broken line. Safety and liveness.
CONSTANTS
    Clients = {A, B}
    Maps = {M1, M2}
    Nil = Nil
    MaxWrites = 2
    MaxMoves = 2
    MaxDrops = 1
SPECIFICATION Spec
INVARIANTS TypeOK NoForeignWake ShowsItsFloor Agree FlightIsTrue NothingOnTheWayAtTable WriteFindsLive TableFindsOut
PROPERTIES NoEcho KeptWhileDown ArrivalSendsNothing WriteStaysOnItsMap SettlesInAgreement
