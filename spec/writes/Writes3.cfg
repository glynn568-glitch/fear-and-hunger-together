\* Safety with three games (a game can hear two partners' writes while its own is on the way),
\* one write each, one broken line. The games are alike, so symmetry.
CONSTANTS
    Clients = {A, B, C}
    Vals = {1, 2}
    Nil = 0
    MaxWrites = 1
    MaxDrops = 1
SYMMETRY Perms
SPECIFICATION Spec
INVARIANTS TypeOK Agree FlightIsTrue NothingOnTheWayAtTable WriteFindsLive TableFindsOut WrittenStays
PROPERTIES FirstThrowStands RoomTakesEachWrite NoEcho
